[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-state-builder"
version = "0.1.0"
description = "A graphical editor for artificial colloidal ice states"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=2.0", "polars>=1.0", "PySide6>=6.8"]

[project.scripts]
aci-state-builder = "aci_state_builder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
